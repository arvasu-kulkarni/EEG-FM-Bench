# CBraMod Separate (Single-Task) Linear-Probe Evaluation
# Encoder is frozen (linear probing) and only the classifier head is trained.

seed: 42
master_port: 51116
multitask: false
model_type: 'cbramod'
fs: 200

data:
  batch_size: 32
  num_workers: 2
  datasets:
    motor_mv_img: 'finetune'
    bcic_2a: 'finetune'

model:
  # Optional pretrained state dict for encoder
  pretrained_path: "/home/neurodx/mahir/EEG-Bench/CBraMod/pretrained_weights/pretrained_weights.pth"

  classifier_head:
    head_type: 'flatten_mlp'
    hidden_dims: [128]
    dropout: 0.3
    attn_n_head: 4
    attn_head_dim: 64
    fusion_mode: 'dual'
    fusion_n_head: 4
    fusion_head_dim: 64
    fusion_use_rope: true
    fusion_rope_theta: 10000.0
    fusion_max_seq_len: 1024

  in_dim: 200
  out_dim: 200
  d_model: 200
  dim_ffn: 800
  n_layer: 12
  n_head: 8
  dropout_rate: 0.1

  grad_cam: false
  t_sne: false

training:
  max_epochs: 30
  weight_decay: 0.01
  max_grad_norm: 1.0

  lr_schedule: 'cosine'
  max_lr: 1.0e-4
  encoder_lr_scale: 1.0
  warmup_epochs: 5
  warmup_scale: 1.0e-2
  pct_start: 0.2
  min_lr: 1.0e-6

  use_amp: true
  freeze_encoder: true

  lora:
    use_lora: false
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.0
    lora_target_modules: ['default']
    lora_exclude_modules: null
    lora_target_type: 'default'
    lora_scope: 'transformer'
    lora_lr_scale: 1.0

logging:
  experiment_name: 'cbramod'
  run_dir: 'runs/cbramod'

  use_cloud: false
  cloud_backend: 'wandb'
  project: 'cbramod'
  entity: null
  api_key: null
  offline: false

  tags: ['cbramod', 'separate', 'linear_probe', 'eval']

  log_step_interval: 1
  ckpt_interval: 5
