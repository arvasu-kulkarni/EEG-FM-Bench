# MANAS Unified (Multitask) Training Configuration
# Placeholder config mirroring REVE template

# Training pattern flags
seed: 42
repetition: 1
master_port: 51105
multitask: false
model_type: 'manas'
fs: 200

# Data configuration
data:
  batch_size: 32
  num_workers: 16
  datasets:
    # seed: 'finetune'
    motor_mv_img: 'finetune'
    workload: 'finetune'
    # tuev: 'finetune'
    # tuab: 'finetune'
    hmc: 'finetune'
    siena_scalp: 'finetune'
    # tusl: 'finetune'
    # mimul_11: 'finetune'
    # things_eeg_2: 'finetune'
    # seed_v: 'finetune'
    adftd: 'finetune'
    bcic_2a: 'finetune'
    # seed_vii: 'finetune'

# MANAS model configuration
model:
  # Pretrained weights
  pretrained_path: '/share/data/MAE-Ablations/MODEL_LARGE_DATAD1_LOSSR1_AUGA0.pt'

  # Architecture parameters
  patch_seconds: 1.0
  overlap_seconds: 0.1
  embed_dim: 512
  encoder_depth: 12
  encoder_heads: 8
  decoder_depth: 4
  decoder_heads: 8
  mask_ratio: 0.55
  aux_loss_weight: 0.1

  # Classifier head configuration
  classifier_head:
    head_type: 'flatten_mlp'  # Options: avg_pool, attention_pool, dual_stream_fusion, flatten_mlp

    # Common parameters
    hidden_dims: [128]
    dropout: 0.3

    # Attention Pool parameters (for attention_pool)
    attn_n_head: 4
    attn_head_dim: 64

    # Dual Stream Fusion parameters (for dual_stream_fusion)
    fusion_mode: 'dual'  # Options: time_first, channel_first, dual
    fusion_n_head: 4
    fusion_head_dim: 64
    fusion_use_rope: true
    fusion_rope_theta: 10000.0
    fusion_max_seq_len: 1024

# Training configuration
training:
  max_epochs: 30
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Optimizer settings
  lr_schedule: "cosine"
  max_lr: 2.0e-4
  min_lr: 2.0e-5
  warmup_epochs: 3
  warmup_scale: 1e-1
  encoder_lr_scale: 0.1

  # Training options
  use_amp: true
  freeze_encoder: true

  # LoRA configuration
  lora:
    use_lora: false
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.0
    lora_target_modules: ['default']
    lora_exclude_modules: null
    lora_target_type: 'default'  # Options: default, full, attention, ffn
    lora_scope: 'transformer'    # Options: transformer, full
    lora_lr_scale: 1.0

# Logging configuration
logging:
  experiment_name: "manas"
  run_dir: "assets/run"

  # Cloud logging
  use_cloud: true
  cloud_backend: "wandb"

  project: "manas"
  tags:
    - "manas"
    - "separated"
    - "frozen"
    - "mlp-head"
    - "verified"
    - "MODEL_LARGE_DATAD1_LOSSR1_AUGA0.pt"
    - "eval best"

  # Logging intervals
  log_step_interval: 1
  ckpt_interval: 5
