# MANAS Unified (Multitask) Training Configuration
# Placeholder config mirroring REVE template

# Training pattern flags
seed: 42
repetition: 1
master_port: 51231
multitask: false
model_type: 'manas-long'
fs: 200

# Data configuration
data:
  batch_size: 16
  num_workers: 16
  datasets:
    # seed: 'finetune'
    # motor_mv_img: 'finetune'
    # workload: 'finetune'
    # tuev: 'finetune'
    # tuab: 'finetune'
    # hmc: 'finetune'
    # siena_scalp: 'finetune'
    # tusl: 'finetune'
    # mimul_11: 'finetune'
    # things_eeg_2: 'finetune'
    # seed_v: 'finetune'
    # adftd: 'finetune'
    # bcic_2a: 'finetune'
    # # seed_vii: 'finetune'
    # epilepsy_pnes_20s: 'finetune'
    hmc_90: 'finetune'
    hmc_60: 'finetune'
    adftd_30: 'finetune'

# MANAS model configuration
model:
  # Pretrained weights
  pretrained_path: '/share/arvasunewtemp/longv0/2026-03-23_14-45-47/mae_epoch_34.pt'
  # longv0control was trained with the Mahir MAE variant.
  mae_type: 'mahir'  # default: 'default'; options: default, mahir

  # Architecture parameters
  patch_seconds: 1.0
  overlap_seconds: 0.1
  embed_dim: 512
  # longv0control checkpoint expects a 22-layer encoder.
  encoder_depth: 22  # default: 12
  encoder_heads: 8
  # longv0control checkpoint expects a 5-layer decoder.
  decoder_depth: 5  # default: 4
  decoder_heads: 8
  mask_ratio: 0.55
  aux_loss_weight: 0.1

  # Mahir MAE masking / PE options
  which_mask: "default"
  fuzzy_noise_std: 0.1
  spatial_radius_black: 3.0
  spatial_radius_fuzzy: 4.0
  temporal_radius_black: 3.0
  temporal_radius_fuzzy: 4.0
  dropout_ratio: 0.1
  dropout_radius: 3.0
  ema_mix_ratio: 0.6
  ema_temperature: 2.0
  ema_floor_eps: 0.1
  # /share/mae_epoch_50.pt was trained without pairwise-channel expansion:
  # n_coords = 4 => (x,y,z,time), n_spatial_coords = 3, posenc_n_freqs = 4.
  use_pairwise_channel_diffs: false
  pairwise_exclude_datasets: []
  n_spatial_coords: 3
  posenc_n_freqs: 4

  # Classifier head configuration
  classifier_head:
    head_type: 'attention_pool'  # Options: avg_pool, attention_pool, dual_stream_fusion, flatten_mlp

    # Common parameters
    hidden_dims: [128]
    dropout: 0.3

    # Attention Pool parameters (for attention_pool)
    attn_n_head: 8
    attn_head_dim: 96

    # Dual Stream Fusion parameters (for dual_stream_fusion)
    fusion_mode: 'dual'  # Options: time_first, channel_first, dual
    fusion_n_head: 4
    fusion_head_dim: 64
    fusion_use_rope: true
    fusion_rope_theta: 10000.0
    fusion_max_seq_len: 1024

# Training configuration
training:
  max_epochs: 20
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Optimizer settings
  lr_schedule: "cosine"
  max_lr: 2.0e-4
  min_lr: 2.0e-5
  warmup_epochs: 3
  warmup_scale: 1e-1
  encoder_lr_scale: 0.1

  # Training options
  use_amp: true
  train_method: "full_ft"  # Options: linear_probe, partial_ft, full_ft
  dual_stage: false             # If true: first N/2 epochs linear_probe, then train_method

  # LoRA configuration
  lora:
    use_lora: false
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.0
    lora_target_modules: ["attn", "ffn.0", "ffn.2"]
    lora_exclude_modules: null
    lora_target_type: 'full'  # Options: default, full, attention, ffn
    lora_scope: 'full'    # Options: transformer, full
    lora_lr_scale: 1.0

# Logging configuration
logging:
  experiment_name: "manas"
  run_dir: "/share/tmp/arvasundx/eval/longv0longeval_attn"

  # Cloud logging
  use_cloud: true
  cloud_backend: "wandb"

  project: "manas"
  tags:
    - "manas-longv0-longeval_attn"
    - "separated"
    - "full_ft"
    - "attention_pool"

  # Logging intervals
  log_step_interval: 1
  ckpt_interval: 1
