# MANAS Unified (Multitask) Training Configuration
# Placeholder config mirroring REVE template

# Training pattern flags
seed: 42
repetition: 1
master_port: 51231
multitask: false
model_type: 'manas'
fs: 200

# Data configuration
data:
  batch_size: 4
  num_workers: 16
  # Position source for MANAS adapter:
  # true  -> legacy MNE montage generation
  # false -> load from positions_json_path (fallback to MNE if channels are missing)
  use_legacy_mne_positions: false
  positions_json_path: "./positions.json"
  # datasets:
  #   motor_mv_img: 'finetune'
  #   workload: 'finetune'
  #   hmc: 'finetune'
  #   siena_scalp: 'finetune'
  #   adftd: 'finetune'
  #   bcic_2a: 'finetune'

# MANAS model configuration
model:
  # Pretrained weights
  pretrained_path: '/home/neurodx/mahir/ndx-pipeline/runs/scheduledMasking/mae_epoch_10.pt'
  mae_type: 'mahir'

  # Architecture parameters
  patch_seconds: 1.0
  overlap_seconds: 0.1
  embed_dim: 512
  encoder_depth: 12
  encoder_heads: 8
  decoder_depth: 4
  decoder_heads: 8
  mask_ratio: 0.55
  aux_loss_weight: 0.1

  # Mahir MAE masking / PE options
  which_mask: "default"
  fuzzy_noise_std: 0.1
  spatial_radius_black: 3.0
  spatial_radius_fuzzy: 4.0
  temporal_radius_black: 3.0
  temporal_radius_fuzzy: 4.0
  dropout_ratio: 0.1
  dropout_radius: 3.0
  ema_mix_ratio: 0.6
  ema_temperature: 2.0
  ema_floor_eps: 0.1
  # /share/mae_epoch_50.pt was trained without pairwise-channel expansion:
  # n_coords = 4 => (x,y,z,time), n_spatial_coords = 3, posenc_n_freqs = 4.
  use_pairwise_channel_diffs: false
  pairwise_exclude_datasets: []
  n_spatial_coords: 3
  posenc_n_freqs: 4

  # Classifier head configuration
  classifier_head:
    head_type: 'flatten_mlp'  # Options: avg_pool, attention_pool, dual_stream_fusion, flatten_mlp

    # Common parameters
    hidden_dims: [128]
    dropout: 0.3

    # Attention Pool parameters (for attention_pool)
    attn_n_head: 4
    attn_head_dim: 64

    # Dual Stream Fusion parameters (for dual_stream_fusion)
    fusion_mode: 'dual'  # Options: time_first, channel_first, dual
    fusion_n_head: 4
    fusion_head_dim: 64
    fusion_use_rope: true
    fusion_rope_theta: 10000.0
    fusion_max_seq_len: 1024

# Training configuration
training:
  max_epochs: 30
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Optimizer settings
  lr_schedule: "cosine"
  max_lr: 2.0e-4
  min_lr: 2.0e-5
  warmup_epochs: 3
  warmup_scale: 1e-1
  encoder_lr_scale: 0.1

  # Training options
  use_amp: true
  train_method: "linear_probe"  # Options: linear_probe, partial_ft, full_ft
  dual_stage: false             # If true: first N/2 epochs linear_probe, then train_method

  # LoRA configuration
  lora:
    use_lora: false
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.0
    lora_target_modules: ["attn", "ffn.0", "ffn.2"]
    lora_exclude_modules: null
    lora_target_type: 'full'  # Options: default, full, attention, ffn
    lora_scope: 'full'    # Options: transformer, full
    lora_lr_scale: 1.0

# Logging configuration
logging:
  experiment_name: "manas"
  run_dir: "/share/tmp/arvasu/runs/sanity_oldnew"

  # Cloud logging
  use_cloud: true
  cloud_backend: "wandb"

  project: "manas"
  tags:
    - "manas"
    - "separated"
    - "lp"
    - "flatten_mlp"

  # Logging intervals
  log_step_interval: 1
  ckpt_interval: 5
