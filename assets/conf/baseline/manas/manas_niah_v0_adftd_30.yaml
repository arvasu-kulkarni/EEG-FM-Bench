seed: 42
repetition: 1
master_port: 51272
multitask: false
model_type: "manas-long-v0.4"
fs: 200

data:
  batch_size: 32
  num_workers: 8
  datasets:
    niah_adftd_30_v0: finetune
  synthetic_tasks:
    niah_adftd_30_v0:
      kind: "niah_v0"
      source_dataset: "adftd_30"
      source_config: "finetune"
      seed: 42
      normalize_targets: true
      target_names: ["center", "duration"]
      amplitude_scale_range: [4.0, 8.0]
      gaussian_weight: 0.7
      lobe_weight: 0.3
      channel_gain_jitter_std: 0.05
      center_margin_sec: 0.0
      allow_negative_polarity: true
      gaussian:
        duration_sec_range: [0.12, 0.35]
        sigma_ratio_range: [0.08, 0.12]
        noise_fraction_range: [0.02, 0.05]
      lobe:
        duration_sec_range: [0.35, 0.90]
        second_half_scale_range: [0.65, 0.85]
        noise_fraction_range: [0.02, 0.06]

model:
  pretrained_path: "/share/v0.4-mae_epoch_40.pt"
  patch_seconds: 1.0
  overlap_seconds: 0.1
  embed_dim: 1024
  encoder_depth: 22
  encoder_heads: 8
  decoder_depth: 5
  decoder_heads: 8
  mask_ratio: 0.55
  aux_loss_weight: 0.1
  which_mask: "default"
  fuzzy_noise_std: 0.0
  spatial_radius_black: 3.0
  spatial_radius_fuzzy: 4.0
  temporal_radius_black: 3.0
  temporal_radius_fuzzy: 4.0
  dropout_ratio: 0.1
  dropout_radius: 4.0
  ema_mix_ratio: 0.6
  ema_temperature: 2.0
  ema_floor_eps: 0.1
  use_pairwise_channel_diffs: false
  pairwise_exclude_datasets: []
  n_spatial_coords: 3
  posenc_n_freqs: 4
  attn_dropout: 0.0
  use_flash_attention: true
  pool_from_mha_outputs: true
  num_local_aux_tokens: 9
  remove_bias_except_decoder_out: false
  use_memory_tokens: true
  memory_scales_seconds: [5.0, 30.0]
  memory_active_scales_seconds: [5.0, 30.0]
  memory_attention_scales_seconds: [5.0, 30.0]
  memory_attention_use_null_token: false
  memory_encoder_access_start_layers:
    5.0: 7
    30.0: 16
  memory_decoder_access_start_layers:
    5.0: 3
    30.0: 1
  memory_conv_kernel_sizes:
    5.0: 400
    30.0: 800
  memory_patch_conv_channels: 64
  memory_token_dims:
    5.0: 1024
    30.0: 1024
  memory_window_policy_enabled: true
  memory_window_scale_thresholds_seconds:
    5.0: 5.0
    30.0: 30.0
  memory_window_behavior_if_none_valid: "disable_memory"
  classifier_head:
    head_type: "attention_pool"
    hidden_dims: [128]
    dropout: 0.3
    attn_n_head: 4
    attn_head_dim: 64
    fusion_mode: "dual"
    fusion_n_head: 4
    fusion_head_dim: 64
    fusion_use_rope: true
    fusion_rope_theta: 10000.0
    fusion_max_seq_len: 1024

training:
  max_epochs: 20
  weight_decay: 0.05
  max_grad_norm: 1.0
  lr_schedule: "cosine"
  max_lr: 2.4e-4
  min_lr: 2.4e-6
  warmup_epochs: 5
  warmup_scale: 1e-1
  encoder_lr_scale: 0.1
  use_amp: true
  train_method: "full_ft"
  dual_stage: false
  lora:
    use_lora: false
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.0
    lora_target_modules: ["attn", "ffn.0", "ffn.2"]
    lora_exclude_modules: null
    lora_target_type: "full"
    lora_scope: "full"
    lora_lr_scale: 1.0

logging:
  experiment_name: "manas_niah_v0_adftd_30"
  run_dir: "/share/arvasunewtemp/eval/manas_niah_v0_adftd_30"
  use_cloud: true
  cloud_backend: "wandb"
  project: "manas"
  tags:
    - "manas-long-v0.4"
    - "niah-v0"
    - "adftd-30"
    - "attention_pool"
  log_step_interval: 1
  ckpt_interval: 1
