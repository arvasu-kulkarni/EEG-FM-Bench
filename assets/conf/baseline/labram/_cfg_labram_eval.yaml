# LaBraM Separate (Single-Task) Training/Evaluation Configuration
# Trains one model per dataset because multitask=false.

# Training pattern flags
seed: 42
master_port: 51105
multitask: false
model_type: 'labram'
fs: 200

# Data configuration
data:
  batch_size: 32
  num_workers: 4
  datasets:
    motor_mv_img: 'finetune'
    bcic_2a: 'finetune'

# LaBraM model configuration
model:
  # Optional pretrained checkpoint path for LaBraM (student.* weights expected by loader)
  pretrained_path: "/home/neurodx/mahir/EEG-Bench/eeg_bench/models/bci/LaBraM/labram-base.pth"

  # Classifier head configuration
  classifier_head:
    head_type: 'flatten_mlp'  # Options: avg_pool, attention_pool, dual_stream_fusion, flatten_mlp
    hidden_dims: [128]
    dropout: 0.3
    attn_n_head: 4
    attn_head_dim: 64
    fusion_mode: 'dual'
    fusion_n_head: 4
    fusion_head_dim: 64
    fusion_use_rope: true
    fusion_rope_theta: 10000.0
    fusion_max_seq_len: 1024

  # Architecture parameters
  eeg_size: 2000
  patch_size: 200
  in_chans: 1
  out_chans: 8
  embed_dim: 200
  depth: 12
  num_heads: 10
  mlp_ratio: 4.0

  # Regularization and initialization
  dropout_rate: 0.1
  attn_dropout_rate: 0.1
  drop_path_rate: 0.1
  init_values: 0.1
  init_scale: 0.001
  layer_scale_init_value: 0.1
  qkv_bias: false

  # Positional embeddings
  use_abs_pos_emb: true
  use_rel_pos_bias: false
  use_shared_rel_pos_bias: false
  use_mean_pooling: true

  # Visualization hooks
  grad_cam: false
  t_sne: false

# Training configuration
training:
  max_epochs: 30
  weight_decay: 0.05
  max_grad_norm: 3.0

  # Learning rate schedule
  lr_schedule: 'cosine'  # Supported by trainer: onecycle, cosine
  max_lr: 8.0e-4
  encoder_lr_scale: 0.1
  warmup_epochs: 5
  warmup_scale: 1.0e-2
  pct_start: 0.2
  min_lr: 8.0e-6

  # Training options
  use_amp: true
  train_method: "full_ft"  # Options: linear_probe, partial_ft, full_ft
  dual_stage: false             # If true: first N/2 epochs linear_probe, then train_method
  label_smoothing: 0.1

  # LoRA configuration
  lora:
    use_lora: false
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.0
    lora_target_modules: ['default']
    lora_exclude_modules: null
    lora_target_type: 'default'
    lora_scope: 'transformer'
    lora_lr_scale: 1.0

# Logging configuration
logging:
  experiment_name: 'labram'
  run_dir: 'runs/labram'

  # Disable cloud logging by default for local benchmark runs
  use_cloud: false
  cloud_backend: 'wandb'
  project: 'labram'
  entity: null
  api_key: null
  offline: false

  tags: ['labram', 'separate', 'full', 'eval']

  log_step_interval: 1
  ckpt_interval: 5
